<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Palette taken from The Garden of Time artwork */
:root{color-scheme:dark;
--bg:#3B0B14;--card:#531924;--ink:#F2EBDD;--mute:#CDAFA6;--line:#7C3B46;
--accent:#D9BB78;--onaccent:#3B0B14;--err:#FF9F8F;
--d-Design:#E08CA6;--d-PR:#E3B45C;--d-Operations:#A9BC8C;--d-Sponsorships:#B79DCB;--d-None:#A58A86}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 20% 0%,#5A1722 0%,var(--bg) 60%) fixed;color:var(--ink);font:16px/1.5 "Public Sans",system-ui,sans-serif}
h1,h2,h3{font-family:Newsreader,Georgia,serif;margin:0;line-height:1.15}
header{padding:2rem 1.25rem 1rem;max-width:1100px;margin:0 auto}
h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:700;letter-spacing:-.01em}
.sub{color:var(--mute);margin:.4rem 0 0;max-width:60ch}
main{max-width:1100px;margin:0 auto;padding:0 1.25rem 4rem}
.figs{display:flex;gap:2rem;flex-wrap:wrap;margin:1.25rem 0}
.fig strong{font:700 2rem Newsreader,Georgia,serif;display:block;line-height:1}
.fig span{color:var(--mute);font-size:.9rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-bottom:1.5rem}
.bar{display:grid;grid-template-columns:9.5rem 1fr 2rem;gap:.6rem;align-items:center;font-size:.9rem;margin:.25rem 0}
.bar i{display:block;height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);background:var(--c);border-radius:4px}
.bar b{text-align:right}
nav{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin-bottom:1.25rem;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);font:600 1rem inherit;font-family:inherit;padding:.7rem 1rem;cursor:pointer}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
form.add{display:flex;flex-wrap:wrap;gap:.6rem;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem;margin-bottom:1rem}
label{display:flex;flex-direction:column;font-size:.85rem;color:var(--mute);gap:.2rem}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:.5rem .6rem;min-width:0}
.clubs{display:flex;flex-wrap:wrap;gap:.4rem .9rem;flex-basis:100%}
.clubs label{flex-direction:row;align-items:center;gap:.35rem;color:var(--ink)}
.btn{font:600 .95rem inherit;font-family:inherit;background:var(--accent);color:var(--onaccent);border:0;border-radius:6px;padding:.55rem 1rem;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:.25rem .6rem;font-size:.8rem}
.filters{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.75rem;align-items:end}
.filters .grow{flex:1;min-width:10rem}
.row{display:grid;grid-template-columns:1.4fr .8fr 1fr 2fr auto;gap:.75rem;align-items:center;padding:.7rem .25rem;border-bottom:1px solid var(--line)}
.row b{font-weight:600}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.4rem;background:var(--c)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:0 .6rem;font-size:.8rem;margin:.1rem .25rem .1rem 0}
.role{font-size:.85rem;color:var(--mute)}
.empty{color:var(--mute);padding:1.5rem .25rem}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.col h3{font-size:1.15rem;padding-bottom:.4rem;border-bottom:3px solid var(--c);margin-bottom:.6rem}
.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:8px;padding:.6rem .7rem;margin-bottom:.6rem;font-size:.92rem}
.task small{display:block;color:var(--mute)}
.task .acts{display:flex;gap:.4rem;margin-top:.5rem}
.st-Done b{text-decoration:line-through;color:var(--mute)}
.ev{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:.6rem;padding:.2rem 1rem}
.ev summary{cursor:pointer;padding:.7rem 0;display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:baseline}
.ev summary b{font:700 1.15rem Newsreader,Georgia,serif}
.ev .att{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;padding:.2rem 0 .8rem}
.ev .att label{flex-direction:row;gap:.35rem;color:var(--ink)}
.past{opacity:.75}
body.locked header,body.locked main,body.locked footer{display:none}
#gate{display:none;min-height:100vh;align-items:center;justify-content:center;padding:1.25rem}
body.locked #gate{display:flex}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2rem;width:100%;max-width:24rem}
#gate h1{font-size:2.4rem;margin-bottom:.4rem}
#gate p{color:var(--mute);margin:0 0 1.2rem}
#gate input{width:100%;margin-bottom:.8rem}
#gate .btn{width:100%}
#gate .err{color:var(--err);min-height:1.4rem;margin:.6rem 0 0;font-size:.9rem}
footer{max-width:1100px;margin:0 auto;padding:0 1.25rem 3rem;color:var(--mute);font-size:.85rem}
@media(max-width:820px){.split{grid-template-columns:1fr}.board{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row>:nth-child(4){grid-column:1/-1}}
</style>
</head>
<body class="locked">
<div id="gate">
  <form id="gf">
    <h1>Club Hub</h1>
    <p>This site is for club members. Enter the password to continue.</p>
    <label>Password<input type="password" id="gp" autocomplete="current-password" required autofocus></label>
    <button class="btn">Unlock</button>
    <p class="err" id="ge" role="alert"></p>
  </form>
</div>
<header>
  <h1>Club Hub</h1>
  <p class="sub">Members, domain tasks and sub-club events for our literary club, in one place.</p>
</header>
<main>
  <div id="stats"></div>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="members">Members</button>
    <button role="tab" data-tab="tasks">Domain tasks</button>
    <button role="tab" data-tab="events">Events</button>
  </nav>
  <section id="view"></section>
</main>
<footer>Data is saved in this browser only. <button class="btn ghost sm" data-act="reset">Reset to sample data</button> <button class="btn ghost sm" data-act="lock">Lock site</button></footer>

<script>
const DOMAINS = ["Design", "PR", "Operations", "Sponsorships"];
const CLUBS = ["Reading", "Creative Writing", "Oratorical Union", "Cultural", "Translation & Media", "Theatre"];
const ROLES = ["Core", "Director", "Member"];
const STATUS = ["To do", "In progress", "Done"];
const KEY = "club-hub-v1";

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const dcol = d => `var(--d-${d || "None"})`;
const $ = s => document.querySelector(s);
const day = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const fmt = d => d ? new Date(d + "T00:00").toLocaleDateString(undefined, {day:"numeric", month:"short", year:"numeric"}) : "No date";

let tab = "members", F = {q:"", domain:"", club:"", role:""}, OPEN = new Set();
let S = load();

function seed() {
  const m = (name, role, domain, clubs) => ({id: uid(), name, role, domain, clubs});
  const members = [
    m("Aanya Rao", "Core", "", ["Reading"]),
    m("Kabir Shah", "Director", "Design", ["Translation & Media", "Theatre"]),
    m("Meera Iyer", "Director", "PR", ["Oratorical Union"]),
    m("Rohan Desai", "Director", "Operations", ["Cultural"]),
    m("Isha Nair", "Director", "Sponsorships", ["Creative Writing"]),
    m("Dev Patil", "Member", "PR", ["Theatre", "Oratorical Union"]),
    m("Sara Khan", "Member", "Design", ["Creative Writing", "Reading"]),
    m("Neil Joshi", "Member", "Operations", ["Translation & Media"])
  ];
  const by = n => members.find(x => x.name === n).id;
  return {
    members,
    tasks: [
      {id: uid(), title: "Poster for open mic", domain: "Design", assignee: by("Sara Khan"), due: day(5), status: "In progress"},
      {id: uid(), title: "Press note for debate night", domain: "PR", assignee: by("Dev Patil"), due: day(3), status: "To do"},
      {id: uid(), title: "Book auditorium for the fest", domain: "Operations", assignee: by("Neil Joshi"), due: day(9), status: "To do"},
      {id: uid(), title: "Pitch deck to local bookstore", domain: "Sponsorships", assignee: by("Isha Nair"), due: day(7), status: "Done"}
    ],
    events: [
      {id: uid(), title: "Monthly book discussion", club: "Reading", date: day(4), venue: "Library lawn", att: []},
      {id: uid(), title: "Inter-college debate", club: "Oratorical Union", date: day(12), venue: "Main hall", att: []},
      {id: uid(), title: "Script reading", club: "Theatre", date: day(-6), venue: "Room 204", att: [by("Dev Patil"), by("Kabir Shah")]}
    ]
  };
}
function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && d.members) return d; } catch (e) {}
  return seed();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} render(); }
const mname = id => (S.members.find(m => m.id === id) || {name: "Unassigned"}).name;

/* ---------- Summary ---------- */
function stats() {
  const n = S.members.length, today = day(0);
  const open = S.tasks.filter(t => t.status !== "Done").length;
  const up = S.events.filter(e => e.date >= today).length;
  const bar = (label, count, color) =>
    `<div class="bar"><span>${esc(label)}</span><i style="--w:${n ? count / n * 100 : 0}%;--c:${color}"></i><b>${count}</b></div>`;
  $("#stats").innerHTML = `
    <div class="figs">
      <div class="fig"><strong>${n}</strong><span>members</span></div>
      <div class="fig"><strong>${open}</strong><span>open tasks</span></div>
      <div class="fig"><strong>${up}</strong><span>upcoming events</span></div>
    </div>
    <div class="split">
      <div><h3>By domain</h3>${DOMAINS.map(d => bar(d, S.members.filter(m => m.domain === d).length, dcol(d))).join("")}</div>
      <div><h3>By sub-club</h3>${CLUBS.map(c => bar(c, S.members.filter(m => m.clubs.includes(c)).length, "var(--accent)")).join("")}</div>
    </div>`;
}

/* ---------- Members ---------- */
const opts = (arr, sel) => arr.map(x => `<option ${x === sel ? "selected" : ""}>${esc(x)}</option>`).join("");

function membersView() {
  return `
  <form class="add" id="fm">
    <label>Name<input name="name" required></label>
    <label>Role<select name="role">${opts(ROLES, "Member")}</select></label>
    <label>Domain<select name="domain"><option value="">No domain</option>${opts(DOMAINS)}</select></label>
    <div class="clubs">${CLUBS.map(c => `<label><input type="checkbox" name="club" value="${esc(c)}">${esc(c)}</label>`).join("")}</div>
    <button class="btn">Add member</button>
  </form>
  <div class="filters">
    <label class="grow">Search<input id="fq" placeholder="Name" value="${esc(F.q)}"></label>
    <label>Role<select id="fr"><option value="">All</option>${opts(ROLES, F.role)}</select></label>
    <label>Domain<select id="fd"><option value="">All</option>${opts(DOMAINS, F.domain)}</select></label>
    <label>Sub-club<select id="fc"><option value="">All</option>${opts(CLUBS, F.club)}</select></label>
    <button class="btn ghost" data-act="csv-m">Export CSV</button>
  </div>
  <div id="mlist"></div>`;
}
function memberList() {
  const q = F.q.toLowerCase();
  const list = S.members.filter(m =>
    (!q || m.name.toLowerCase().includes(q)) && (!F.role || m.role === F.role) &&
    (!F.domain || m.domain === F.domain) && (!F.club || m.clubs.includes(F.club)));
  $("#mlist").innerHTML = list.length ? list.map(m => `
    <div class="row">
      <b>${esc(m.name)}</b>
      <span class="role">${esc(m.role)}</span>
      <span><i class="dot" style="--c:${dcol(m.domain)}"></i>${esc(m.domain || "No domain")}</span>
      <span>${m.clubs.map(c => `<span class="chip">${esc(c)}</span>`).join("") || '<span class="role">No sub-clubs</span>'}</span>
      <button class="btn ghost sm" data-act="del-m" data-id="${m.id}" aria-label="Remove ${esc(m.name)}">Remove</button>
    </div>`).join("") : `<p class="empty">No members match these filters. Clear a filter or add a member above.</p>`;
}

/* ---------- Tasks ---------- */
function tasksView() {
  return `
  <form class="add" id="ft">
    <label>Task<input name="title" required></label>
    <label>Domain<select name="domain">${opts(DOMAINS)}</select></label>
    <label>Assign to<select name="assignee"><option value="">Unassigned</option>${S.members.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join("")}</select></label>
    <label>Due<input type="date" name="due"></label>
    <button class="btn">Add task</button>
  </form>
  <div class="board">${DOMAINS.map(d => {
    const ts = S.tasks.filter(t => t.domain === d);
    return `<div class="col" style="--c:${dcol(d)}"><h3>${d}</h3>${ts.length ? ts.map(t => `
      <div class="task st-${t.status.replace(" ", "")}" style="--c:${dcol(d)}">
        <b>${esc(t.title)}</b>
        <small>${esc(mname(t.assignee))}, due ${fmt(t.due)}</small>
        <div class="acts">
          <button class="btn ghost sm" data-act="cyc-t" data-id="${t.id}" title="Click to change status">${t.status}</button>
          <button class="btn ghost sm" data-act="del-t" data-id="${t.id}">Delete</button>
        </div>
      </div>`).join("") : `<p class="empty">No tasks yet.</p>`}</div>`;
  }).join("")}</div>`;
}

/* ---------- Events ---------- */
function eventsView() {
  const today = day(0);
  const evs = [...S.events].sort((a, b) => a.date.localeCompare(b.date));
  return `
  <form class="add" id="fe">
    <label>Event<input name="title" required></label>
    <label>Sub-club<select name="club">${opts(CLUBS)}</select></label>
    <label>Date<input type="date" name="date" required></label>
    <label>Venue<input name="venue"></label>
    <button class="btn">Add event</button>
    <button type="button" class="btn ghost" data-act="csv-e">Export CSV</button>
  </form>
  ${evs.length ? evs.map(e => {
    const pool = S.members.filter(m => m.clubs.includes(e.club));
    return `<details class="ev ${e.date < today ? "past" : ""}" data-id="${e.id}" ${OPEN.has(e.id) ? "open" : ""}>
      <summary><b>${esc(e.title)}</b><span>${esc(e.club)}</span><span class="role">${fmt(e.date)}${e.venue ? ", " + esc(e.venue) : ""}</span><span class="chip">${e.att.length} attended</span></summary>
      <div class="att">${pool.length ? pool.map(m => `<label><input type="checkbox" data-att="${e.id}" value="${m.id}" ${e.att.includes(m.id) ? "checked" : ""}>${esc(m.name)}</label>`).join("") : '<span class="role">No members in this sub-club yet.</span>'}</div>
      <button class="btn ghost sm" data-act="del-e" data-id="${e.id}">Delete event</button>
      <p></p>
    </details>`;
  }).join("") : `<p class="empty">No events yet. Add one above to start tracking attendance.</p>`}`;
}

/* ---------- Render ---------- */
function render() {
  stats();
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  $("#view").innerHTML = tab === "members" ? membersView() : tab === "tasks" ? tasksView() : eventsView();
  if (tab === "members") memberList();
}

/* ---------- CSV ---------- */
function csv(name, rows) {
  const text = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type: "text/csv"}));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

/* ---------- Events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-tab],[data-act]"); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; return render(); }
  const id = t.dataset.id;
  switch (t.dataset.act) {
    case "del-m": S.members = S.members.filter(m => m.id !== id);
      S.events.forEach(ev => ev.att = ev.att.filter(a => a !== id));
      S.tasks.forEach(tk => { if (tk.assignee === id) tk.assignee = ""; }); break;
    case "del-t": S.tasks = S.tasks.filter(x => x.id !== id); break;
    case "del-e": S.events = S.events.filter(x => x.id !== id); break;
    case "cyc-t": { const tk = S.tasks.find(x => x.id === id); tk.status = STATUS[(STATUS.indexOf(tk.status) + 1) % 3]; break; }
    case "csv-m": return csv("members.csv", [["Name", "Role", "Domain", "Sub-clubs"], ...S.members.map(m => [m.name, m.role, m.domain, m.clubs.join("; ")])]);
    case "csv-e": return csv("events.csv", [["Event", "Sub-club", "Date", "Venue", "Attendees"], ...S.events.map(v => [v.title, v.club, v.date, v.venue, v.att.map(mname).join("; ")])]);
    case "lock": try { sessionStorage.removeItem("hub-ok"); } catch (x) {} location.reload(); return;
    case "reset": if (!confirm("Replace all data with the sample data?")) return; S = seed(); break;
  }
  save();
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = new FormData(e.target);
  if (e.target.id === "fm") S.members.push({id: uid(), name: f.get("name").trim(), role: f.get("role"), domain: f.get("domain"), clubs: f.getAll("club")});
  if (e.target.id === "ft") S.tasks.push({id: uid(), title: f.get("title").trim(), domain: f.get("domain"), assignee: f.get("assignee"), due: f.get("due"), status: "To do"});
  if (e.target.id === "fe") S.events.push({id: uid(), title: f.get("title").trim(), club: f.get("club"), date: f.get("date"), venue: f.get("venue").trim(), att: []});
  save();
});

document.addEventListener("input", e => {
  const m = {fq: "q", fr: "role", fd: "domain", fc: "club"}[e.target.id];
  if (m) { F[m] = e.target.value; memberList(); }
});

document.addEventListener("change", e => {
  const id = e.target.dataset.att; if (!id) return;
  const ev = S.events.find(x => x.id === id), v = e.target.value;
  ev.att = e.target.checked ? [...new Set([...ev.att, v])] : ev.att.filter(a => a !== v);
  save();
});

document.addEventListener("toggle", e => {
  const id = e.target.dataset && e.target.dataset.id;
  if (id && e.target.tagName === "DETAILS") e.target.open ? OPEN.add(id) : OPEN.delete(id);
}, true);

/* ---------- Password gate (front-end only, see README) ---------- */
const PASS_HASH = "9c3acb02dca7afb47db4f97a608139dbcaff4e00d7cd61cab345375a0b0fac10";
async function sha256(t) {
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
function unlock() { document.body.classList.remove("locked"); render(); }
document.addEventListener("submit", async e => {
  if (e.target.id !== "gf") return;
  const err = $("#ge");
  try {
    if (await sha256($("#gp").value) === PASS_HASH) {
      try { sessionStorage.setItem("hub-ok", "1"); } catch (x) {}
      return unlock();
    }
    err.textContent = "Wrong password. Check it and try again.";
    $("#gp").select();
  } catch (x) {
    err.textContent = "Your browser can't check passwords on this page. Open the site over https.";
  }
});
let ok = false;
try { ok = sessionStorage.getItem("hub-ok") === "1"; } catch (x) {}
if (ok) unlock();
</script>
</body>
</html>
